name = "busrun-api"
main = "worker/src/index.js"
compatibility_date = "2026-07-01"

# No custom domain yet, so this Worker is served from its free
# *.workers.dev URL and the Pages site from its free *.pages.dev URL —
# two different origins. Once you have a real domain, put both under it
# (e.g. yourdomain.com for Pages, yourdomain.com/api/* routed here via the
# block below), then you can go back to relative /api/... calls in the
# frontend and tighten the cookie back to SameSite=Lax.
# routes = [
#   { pattern = "yourdomain.com/api/*", zone_name = "yourdomain.com" }
# ]

[[d1_databases]]
binding = "DB"
database_name = "busrun-db"
database_id = "c6b23041-6811-474b-a24e-3461b9139793"

[vars]
# TODO: update if your Pages project name/URL changes.
ALLOWED_ORIGIN = "https://busrun.pages.dev"
