name = "sisara-coach-api"
main = "worker/src/index.js"
compatibility_date = "2026-07-01"

# Bind this Worker to yourdomain.com/api/* alongside Cloudflare Pages on
# yourdomain.com/* (Pages serves /public, this Worker serves /api).
# routes = [
#   { pattern = "sisaracoach.lk/api/*", zone_name = "sisaracoach.lk" }
# ]

[[d1_databases]]
binding = "DB"
database_name = "sisara-coach-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
ALLOWED_ORIGIN = "https://sisaracoach.lk"
